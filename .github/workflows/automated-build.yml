name: Automated DeepSeek Harness Deb Builder

# 这个工作流是 docs/00-下载-deb.md 的配套：
#   1. 每天 02:00 UTC 自动检查上游 deepseek-ai/deepseek-harness 的最新 dsh-v* 标签，
#      出现新版本就打补丁、构建 Linux x64 deb，并以该标签名发布 Release。
#   2. 任意时刻可手动触发（workflow_dispatch）。不传 version 时同样取上游最新标签，
#      传 version 可指定某个标签，传 force=true 可强制重建并覆盖已有资产。
# 本地需要某个版本的 deb 时：先看 Releases 有没有；没有就用
#   gh workflow run automated-build.yml -R lovedream-ms/deepseek-harness-linux-desktop --ref main
# 触发一次，等它构建完再下载。

on:
  schedule:
    - cron: '0 2 * * *' # 每天 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      version:
        description: '上游 tag，例如 dsh-v0.2.1-rc.3；留空 = 自动取上游最新的 dsh-v* 标签'
        required: false
        default: ''
      force:
        description: '即使该版本已发布过 deb 也重建并覆盖资产'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: automated-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  UPSTREAM_DIR: ${{ github.workspace }}/upstream

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      should_build: ${{ steps.pick.outputs.should_build }}
    steps:
      - name: Pick target version
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          tags=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'dsh-v*' \
                 | sed 's#.*refs/tags/##')
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            # 取最新的 dsh-v* 标签，跳过 alpha/beta（rc 视为可构建的正式候选）
            version=$(printf '%s\n' "$tags" \
              | grep -vE -- '-(alpha|beta)([.-]|$)' \
              | sort -V | tail -n1)
          fi
          if [ -z "${version:-}" ]; then
            echo "::error::无法确定目标版本：上游没有可用的 dsh-v* 标签"
            exit 1
          fi
          # 同一版本号既有正式版又有 rc 时，优先正式版
          bare="${version#dsh-v}"
          bare="${bare%%-*}"
          if printf '%s\n' "$tags" | grep -qx "dsh-v${bare}"; then
            version="dsh-v${bare}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "目标版本：$version"

          has_deb=false
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$version" -R "$GITHUB_REPOSITORY" --json assets \
                 --jq '.assets[].name' 2>/dev/null | grep -q '\.deb$'; then
              has_deb=true
            fi
          fi
          if [ "${FORCE:-false}" = "true" ]; then
            echo "force=true：无视已有资产，重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$has_deb" = "true" ]; then
            echo "$version 已有 deb 资产，跳过构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version 还没有 deb 资产，开始构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build deb
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout patch series
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone upstream at target tag
        run: |
          set -euo pipefail
          git clone "https://github.com/${UPSTREAM_REPO}.git" "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" checkout "${{ needs.resolve.outputs.version }}"
          git -C "$UPSTREAM_DIR" log -1 --oneline

      - name: Apply Linux patch series
        run: ./apply.sh "$UPSTREAM_DIR"

      - name: Install dependencies
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build the deb
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop run package:linux:x64
          ls -lh apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb
          sha256sum apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb > sha256sum.txt
          cat sha256sum.txt

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$UPSTREAM_DIR"/apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb \
             "$GITHUB_WORKSPACE/dist/"
          cp "$UPSTREAM_DIR"/sha256sum.txt "$GITHUB_WORKSPACE/dist/"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload the deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the deb
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          debver="${version#dsh-v}"
          debname="deepseek-harness-${debver}-linux-amd64.deb"
          title="DeepSeek Harness ${debver} for Linux"
          body="Automated Linux x64 build of upstream ${version}."
          body="${body}"$'\n\n'"Install:"$'\n\n'"    sudo apt install ./${debname}"
          body="${body}"$'\n\n'"Checksum file: sha256sum.txt. Downloaded deb should match it;"
          body="${body}"$'\n'"见 docs/00-下载-deb.md 的校验步骤。"
          if [ -f dist/sha256sum.txt ]; then
            echo "已附带 sha256sum.txt"
          fi
          files=$(find dist -type f \( -name '*.deb' -o -name 'sha256sum.txt' \) -print)
          if [ -z "$files" ]; then
            echo "::error::dist 里没有 deb/sha256sum.txt"
            ls -R dist
            exit 1
          fi
          echo "将发布：$files"
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$version" $files -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$version" -R "$GITHUB_REPOSITORY" --title "$title" --notes "$body"
          else
            gh release create "$version" $files \
              -R "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
          fi
